# Published under docs/ but deliberately not linked from the landing page.
# An entry here is a decision on the record; anything not listed and not linked FAILS.
unlinked:
  - path: files/docstyle.css
    why: stylesheet the pandoc-rendered documents pull in, not a page
  - path: book/index.html
    why: linked from the prose of the "course as a book" section, not from a data table
  - path: workbook/index.html
    why: linked from the prose of the workbook section, not from a data table
