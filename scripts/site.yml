textbooks:
- book: '<a href="https://otexts.com/fpppy/" target="_blank" rel="noopener">FPP-Py</a> &mdash; <em>Forecasting:
    Principles and Practice, the Pythonic Way</em>'
  used_for: Lectures 1&ndash;3; the primary text
- book: <a href="https://otexts.com/fpp3/" target="_blank" rel="noopener">FPP3</a> &mdash; the R edition
  used_for: Same material, R code. Chapter 12 is numbered differently &mdash; both numbers are always
    given
- book: <a href="https://www.statlearning.com/" target="_blank" rel="noopener">ISLP</a> &mdash; <em>An
    Introduction to Statistical Learning with Applications in Python</em>
  used_for: Lectures 4&ndash;6. FPP covers no tree methods and no regularization; this fills that gap
- book: <a href="https://bayesiancomputationbook.com/" target="_blank" rel="noopener">BMCP</a> &mdash;
    <em>Bayesian Modeling and Computation in Python</em>
  used_for: Lectures 10&ndash;12. PyMC and ArviZ throughout, which is what we use
