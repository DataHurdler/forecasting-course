# site.yml — the data behind the course landing page.
#
# docs/index.html is GENERATED from this file plus scripts/templates/index.html.in.
# Edit here, never there, then run:  python3 scripts/build_index.py
#
# scripts/check-site-index.py runs in the backtest and fails if the published page is out
# of date with this file, if any href on it is dead, or — the reason this file exists — if
# a page published under docs/ is not linked from the landing page at all. The landing page
# was the last hand-maintained student surface, and it drifted twice on 2026-09-01 alone.
#
# Every artifact under docs/slides, docs/labs, docs/homework and docs/files must appear
# somewhere below or in `unlinked:` with a reason. Adding a lecture means adding it here.

